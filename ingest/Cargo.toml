[package]
name = "albumen-ingest"
version = "0.1.0"
description = "Bit-exact photo ingest: copy originals and sidecars, preserve mtime and filename, verify SHA-256."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
aws-credential-types = "1"
aws-sdk-s3 = "1"
ed25519-dalek = "2.1.1"
flate2 = "1"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "net", "sync"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3"
