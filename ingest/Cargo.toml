[package]
name = "albumen-ingest"
version = "0.1.0"
description = "Bit-exact photo ingest: copy originals and sidecars, preserve mtime and filename, verify SHA-256."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# Test-only env hooks (ALBUMEN_TEST_SAVE_LOG), off in release builds.
test-hooks = []

[dependencies]
albumen-win = { path = "../win" }
aws-credential-types = "1"
directories = "6"
aws-sdk-s3 = "1"
ed25519-dalek = "2.1.1"
flate2 = "1"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "net", "sync"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# sha2 picks SHA-NI and AVX2 at runtime on x86_64 without the asm feature.
# The asm feature builds sha2-asm with cc, which failed to link on the
# windows-2025 MSVC runner. It stays on aarch64 only.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
tempfile = "3"
