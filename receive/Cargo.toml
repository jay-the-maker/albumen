[package]
name = "albumen-receive"
version = "0.1.0"
description = "Camera-to-cloud receiver. WebDAV, SFTP, and FTP write only through copy_verify."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
albumen-ingest = { path = "../ingest" }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
qrcode = "0.14"
rand = "0.10"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
russh = "0.63"
russh-sftp = "3.0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "fs", "io-std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "crypto-rust", "tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(unix)'.dev-dependencies]
xattr = "1"

[dev-dependencies]
png = "0.17"
rqrr = "0.7"
