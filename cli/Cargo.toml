[package]
name = "albumen"
version = "0.1.0"
description = "Copy a photo library bit-exactly and verify the SHA-256 manifest."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "albumen"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
albumen-ingest = { path = "../ingest" }
albumen-receive = { path = "../receive" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

[dev-dependencies]
serde_json = "1"
flate2 = "1"
tar = "0.4"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dev-dependencies]
xattr = "1"
