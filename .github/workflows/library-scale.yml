name: library scale

# Times albumen-mcp on a synthetic 380,000-item library on each desktop OS:
# the first index build, cold start, time to first answer, search p50/p95
# over 200 fixed queries, and peak memory. The library
# is generated in the job by scripts/library-scale.py. Nothing is committed
# and no real photo is read. Report only: a number that misses its target is
# written to the job summary and does not fail the job. Two gates do fail it,
# in the 20,000-item warm-search check: search_warm_p50_vs_hash (a warm
# metadata search over every item divided by hashing every file once) must be
# at most 0.75, and changing 100 files must re-hash exactly those 100.

on:
  # Every PR, so a change anywhere cannot bring back a per-file re-hash in
  # warm search unnoticed.
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      items:
        description: "Library size"
        default: "380000"

permissions:
  contents: read

jobs:
  library-scale:
    name: library scale (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Search reads the saved index, so a run is generation plus one index
    # build plus 201 searches.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF checkout on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Perl for ExifTool
        if: runner.os == 'Windows'
        run: |
          choco install strawberryperl -y --no-progress
          echo "C:/Strawberry/perl/bin" >> "$GITHUB_PATH"

      # The warm metadata search reads ExifTool on its priming pass.
      - name: Install pinned ExifTool
        run: scripts/install-exiftool.sh

      - name: Build albumen-mcp
        run: cargo build --release --locked -p albumen-mcp

      - name: Smoke run at 2,000 items
        run: |
          python scripts/library-scale.py \
            --binary "target/release/albumen-mcp$([ "$RUNNER_OS" = Windows ] && echo .exe)" \
            --library "${RUNNER_TEMP}/library-smoke" --index-dir "${RUNNER_TEMP}/index-smoke" --items 2000 --leg "${{ matrix.os }}-smoke"

      - name: Warm search ratio at 20,000 items (search_warm_p50_vs_hash)
        run: |
          python scripts/library-scale.py \
            --binary "target/release/albumen-mcp$([ "$RUNNER_OS" = Windows ] && echo .exe)" \
            --library "${RUNNER_TEMP}/library-20k" --index-dir "${RUNNER_TEMP}/index-20k" --items 20000 --queries 40 \
            --warm-runs 10 --mutate 100 --max-warm-ratio 0.75 \
            --leg "${{ matrix.os }}-20k" --json "${RUNNER_TEMP}/library-scale-20k.json"

      - name: Generate and time the full library
        env:
          ITEMS: ${{ github.event.inputs.items || '380000' }}
        run: |
          python scripts/library-scale.py \
            --binary "target/release/albumen-mcp$([ "$RUNNER_OS" = Windows ] && echo .exe)" \
            --library "${RUNNER_TEMP}/library-scale" --index-dir "${RUNNER_TEMP}/index-scale" --items "${ITEMS}" \
            --leg "${{ matrix.os }}" --json "${RUNNER_TEMP}/library-scale.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-scale-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/library-scale.json
            ${{ runner.temp }}/library-scale-20k.json
          if-no-files-found: ignore
