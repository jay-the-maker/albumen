name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest:
    name: ingest round-trip (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest moves to Ubuntu 26.04 starting 2026-10-19.
        # 24.04 is the pinned image. 26.04 stays in the matrix only while
        # that leg is green.
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install pinned ExifTool
        run: scripts/install-exiftool.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Round-trip originals through the local filesystem and MinIO
        run: scripts/with-minio.sh cargo test --locked --all-targets

  android:
    name: android camera-roll skeleton
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Java for the Android SDK
        run: |
          if ! command -v java >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jdk-headless unzip
          fi
          java -version

      - name: Compile and test the backup library
        run: scripts/android-ci.sh

  ios:
    name: ios camera-roll skeleton
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build and test the PhotoKit package
        run: swift test --package-path mobile/ios
