name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: dependency licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # deny.toml: new crates must be MIT, Apache-2.0, or Zlib.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  ingest:
    name: ingest round-trip (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest moves to Ubuntu 26.04 starting 2026-10-19.
        # 24.04 is the pinned image. 26.04 stays in the matrix only while
        # that leg is green. macos-14 is the arm64 leg. windows-2025 is the
        # pinned Windows image. windows-latest stays beside it. Each runs the
        # same suite, including MinIO and rclone round-trips, from pinned
        # binaries.
        include:
          - os: ubuntu-24.04
            label: ubuntu-24.04
            timeout: 45
          - os: ubuntu-26.04
            label: ubuntu-26.04
            timeout: 45
          - os: macos-14
            label: macos-14 (arm64)
            timeout: 60
          - os: windows-2025
            label: windows-2025
            timeout: 90
          - os: windows-latest
            label: windows-latest
            timeout: 75
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF checkout on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install Perl for ExifTool
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install strawberryperl -y --no-progress
          echo "C:/Strawberry/perl/bin" >> "$GITHUB_PATH"

      - name: Install pinned ExifTool
        shell: bash
        run: scripts/install-exiftool.sh

      - name: Install pinned rclone
        shell: bash
        run: scripts/install-rclone.sh

      - name: Ban writes outside the destination module
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/check-dest-writes.py --self-test
          "$PY" scripts/check-dest-writes.py

      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: bash
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: ffmpeg for the synthetic Live Photo
        shell: bash
        run: scripts/ensure-ffmpeg.sh

      - name: Round-trip originals through the local filesystem and MinIO
        shell: bash
        run: scripts/with-minio.sh cargo test --locked --all-targets

  android:
    name: android camera-roll backup
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Java for the Android SDK
        run: |
          if ! command -v java >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jdk-headless unzip
          fi
          java -version

      - name: Compile and test the backup library
        run: scripts/android-ci.sh

  backup-soak:
    name: backup soak
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Java for the Android SDK
        run: |
          if ! command -v java >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jdk-headless unzip
          fi
          java -version

      - name: Soak backup cycles with injected faults
        run: scripts/android-soak.sh

  android-emulator:
    name: android camera-roll emulator
    # This job uses ubuntu-latest for KVM. The other jobs stay on ubuntu-24.04.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Java for the Android SDK
        run: |
          if ! command -v java >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jdk-headless unzip
          fi
          java -version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: MediaStore original on an API 30 emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          script: scripts/android-emulator-connected.sh

  ios:
    name: ios camera-roll skeleton
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build and test the PhotoKit package
        run: swift test --package-path mobile/ios

  ios-xcode:
    name: ios background upload
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build the host and the background upload extension
        run: scripts/ios-xcode.sh

  ios-simulator:
    name: ios simulator backup
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Verified copy on the iOS Simulator
        run: scripts/ios-simulator.sh

  mcp-image:
    name: albumen-mcp image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Validate server.json against the registry schema
        run: |
          python3 -m venv /tmp/schema
          /tmp/schema/bin/pip install jsonschema==4.25.1
          python3 scripts/check-mcp-release.py --self-test
          /tmp/schema/bin/python scripts/check-mcp-release.py

      - name: Build the albumen-mcp image
        run: docker build -t albumen-mcp:ci .

      - name: Check the entrypoint, label, and ExifTool
        run: |
          docker run --rm albumen-mcp:ci --help
          docker image inspect albumen-mcp:ci --format '{{index .Config.Labels "io.modelcontextprotocol.server.name"}}' | grep -Fxq 'io.github.jay-the-maker/albumen'
          docker image inspect albumen-mcp:ci --format '{{json .Config.Entrypoint}}' | grep -Fxq '["albumen-mcp","--library","/library"]'
          docker run --rm --entrypoint exiftool albumen-mcp:ci -ver

      - name: Prove the default library mount cannot change originals
        run: scripts/check-library-mount.sh albumen-mcp:ci

  bench:
    name: performance regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install pinned ExifTool
        run: scripts/install-exiftool.sh

      - name: Compare the scaled run with the stored baseline
        run: cargo run --release --locked -p albumen-bench -- --check

  throughput:
    name: import throughput (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: ubuntu-24.04
          - os: ubuntu-26.04
            label: ubuntu-26.04
          - os: macos-14
            label: macos-14
          - os: windows-2025
            label: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF checkout on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      # vmtouch reports, before each sample, how much of the source corpus
      # is in the page cache. With no flags it only calls mincore. The bench
      # records "none" when it is missing, as on Windows.
      - name: Install vmtouch for page-cache residency
        if: runner.os != 'Windows'
        run: |
          if [ "$(uname -s)" = Darwin ]; then
            brew install vmtouch || true
          else
            sudo apt-get install -y vmtouch || { sudo apt-get update && sudo apt-get install -y vmtouch; } || true
          fi
          command -v vmtouch || echo "vmtouch unavailable; residency will be none"

      - name: Import 1000 synthetic files and compare with a raw write
        env:
          ALBUMEN_THROUGHPUT_LEG: ${{ matrix.label }}
          ALBUMEN_THROUGHPUT_DIR: ${{ github.workspace }}/throughput-data
        run: |
          df -h "${GITHUB_WORKSPACE}" /tmp || true
          # The corpus is 5 GB of sources plus 5 GB of destination. ubuntu-26.04
          # returned "Disk quota exceeded" for that pair under /tmp. The work
          # directory is the runner volume. On Linux, drop preinstalled
          # toolchains when that volume has less than 25 GB free.
          if [ "$(uname -s)" = Linux ]; then
            free_kb="$(df -k "${GITHUB_WORKSPACE}" | awk 'NR==2 {print $4}')"
            if [ "${free_kb:-0}" -lt 25000000 ]; then
              sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/share/swift || true
              docker system prune -af || true
            fi
            df -h "${GITHUB_WORKSPACE}" || true
          fi
          mkdir -p "${ALBUMEN_THROUGHPUT_DIR}"
          cargo run --release --locked -p albumen-bench -- --throughput | tee "${RUNNER_TEMP}/throughput.json"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### import throughput (${{ matrix.label }})"
              echo
              echo '```json'
              cat "${RUNNER_TEMP}/throughput.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  sandbox:
    name: no unexpected egress
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install rootless podman and strace
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns strace
          mkdir -p "${XDG_RUNTIME_DIR:-/tmp/albumen-runtime-$(id -u)}"
          chmod 700 "${XDG_RUNTIME_DIR:-/tmp/albumen-runtime-$(id -u)}"
          podman info --format '{{.Host.Security.Rootless}}' | grep -qx true

      - name: Strace scan and run it with network syscalls denied
        run: scripts/scan-no-network.sh

      - name: Sandbox trial against a copy of the fixtures
        run: scripts/sandbox-trial.sh

      - name: Fail on network connections the command did not name
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          scripts/no-unexpected-egress.sh

  zero-network:
    name: zero network (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: ubuntu-24.04
          - os: macos-14
            label: macos-14
          - os: windows-2025
            label: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF checkout on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install pinned ExifTool
        shell: bash
        run: scripts/install-exiftool.sh

      - name: Install strace
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y strace

      - name: Prove scan, index, and search make no connections
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/zero-network.sh

      - name: Prove scan, index, and search make no connections
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File scripts/zero-network.ps1

  package-release:
    name: package release archive (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: albumen-linux-x86_64
          - os: macos-14
            label: macos-14
            target: aarch64-apple-darwin
            artifact: albumen-macos-arm64
          - os: windows-2025
            label: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: albumen-windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF checkout on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binaries
        env:
          TARGET: ${{ matrix.target }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/albumen"
          export CARGO_INCREMENTAL=0
          export CARGO_PROFILE_RELEASE_INCREMENTAL=false
          export CARGO_PROFILE_RELEASE_DEBUG=false
          export CARGO_PROFILE_RELEASE_STRIP=symbols
          cargo build --release --locked --target "$TARGET" -p albumen -p albumen-mcp -p albumen-receive

      - name: Package the archive
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: bash scripts/package-release.sh "$TARGET" "$ARTIFACT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
          if-no-files-found: error

  install-quickstart:
    name: install without Rust (${{ matrix.label }})
    needs: package-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: ubuntu-24.04
            artifact: albumen-linux-x86_64
          - os: macos-14
            label: macos-14
            artifact: albumen-macos-arm64
          - os: windows-2025
            label: windows-2025
            artifact: albumen-windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF checkout on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: release-archive

      - name: This job does not install a Rust toolchain
        run: |
          if [ -n "${RUSTUP_TOOLCHAIN:-}" ]; then
            echo "RUSTUP_TOOLCHAIN is set" >&2
            exit 1
          fi
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/check-quickstart.py --self-test
          "$PY" scripts/check-quickstart.py

      - name: Check the installer without a release binary
        run: bash scripts/check-install.sh

      - name: Quickstart to a verified backup
        if: runner.os != 'Windows'
        env:
          ALBUMEN_ARCHIVE: ${{ github.workspace }}/release-archive/${{ matrix.artifact }}.tar.gz
        run: |
          home="$(mktemp -d)"
          export HOME="$home"
          bash scripts/quickstart.sh | tee "$home/quickstart.out"
          grep -q '^verified: ' "$home/quickstart.out"
          grep -q '^source unchanged$' "$home/quickstart.out"

      - name: Check the PowerShell installer
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File scripts/check-install.ps1

      - name: Quickstart to a verified backup on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $profileRoot = Join-Path $env:RUNNER_TEMP 'albumen-quickstart-home'
          New-Item -ItemType Directory -Force -Path $profileRoot | Out-Null
          $local = Join-Path $profileRoot 'AppData\Local'
          New-Item -ItemType Directory -Force -Path $local | Out-Null
          $env:USERPROFILE = $profileRoot
          $env:LOCALAPPDATA = $local
          $env:ALBUMEN_ARCHIVE = Join-Path $env:GITHUB_WORKSPACE 'release-archive\${{ matrix.artifact }}.tar.gz'
          $out = Join-Path $profileRoot 'quickstart.out'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\quickstart.ps1') | Tee-Object -FilePath $out
          if (-not (Select-String -Path $out -Pattern '^verified: ' -Quiet)) { throw 'SHA-256 verification did not print' }
          if (-not (Select-String -Path $out -Pattern '^source unchanged$' -Quiet)) { throw 'source was not reported unchanged' }
