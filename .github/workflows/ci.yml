name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: dependency licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # deny.toml: new crates must be MIT, Apache-2.0, or Zlib.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  ingest:
    name: ingest round-trip (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest moves to Ubuntu 26.04 starting 2026-10-19.
        # 24.04 is the pinned image. 26.04 stays in the matrix only while
        # that leg is green. macos-14 is the arm64 leg. windows-2025 is the
        # pinned Windows image. windows-latest stays beside it. Each runs the
        # same suite, including MinIO and rclone round-trips, from pinned
        # binaries.
        include:
          - os: ubuntu-24.04
            label: ubuntu-24.04
            timeout: 45
          - os: ubuntu-26.04
            label: ubuntu-26.04
            timeout: 45
          - os: macos-14
            label: macos-14 (arm64)
            timeout: 60
          - os: windows-2025
            label: windows-2025
            timeout: 90
          - os: windows-latest
            label: windows-latest
            timeout: 75
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF checkout on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install Perl for ExifTool
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install strawberryperl -y --no-progress
          echo "C:/Strawberry/perl/bin" >> "$GITHUB_PATH"

      - name: Install pinned ExifTool
        shell: bash
        run: scripts/install-exiftool.sh

      - name: Install pinned rclone
        shell: bash
        run: scripts/install-rclone.sh

      - name: Ban writes outside the destination module
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/check-dest-writes.py --self-test
          "$PY" scripts/check-dest-writes.py

      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: bash
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: ffmpeg for the synthetic Live Photo
        shell: bash
        run: bash scripts/ensure-ffmpeg.sh

      - name: Round-trip originals through the local filesystem and MinIO
        shell: bash
        run: scripts/with-minio.sh cargo test --locked --all-targets

  android:
    name: android camera-roll backup
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Pin JDK 21 (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Java for the Android SDK
        run: |
          if ! command -v java >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jdk-headless unzip
          fi
          java -version

      - name: Compile and test the backup library
        run: scripts/android-ci.sh

  backup-soak:
    name: backup soak
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Pin JDK 21 (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Java for the Android SDK
        run: |
          if ! command -v java >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jdk-headless unzip
          fi
          java -version

      - name: Soak backup cycles with injected faults
        run: scripts/android-soak.sh

  android-emulator:
    name: android camera-roll emulator
    # This job uses ubuntu-latest for KVM. The other jobs stay on ubuntu-24.04.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Pin JDK 21 (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Java for the Android SDK
        run: |
          if ! command -v java >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jdk-headless unzip
          fi
          java -version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: MediaStore original on an API 30 emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          script: scripts/android-emulator-connected.sh

      # Android 14 adds Select photos. SelectedPhotosInstrumentedTest runs
      # alone on a fresh install, then the same connected tests as API 30.
      - name: MediaStore original and Select photos on an API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          script: |
            bash scripts/android-emulator-selected-photos.sh
            scripts/android-emulator-connected.sh

  ios:
    name: ios camera-roll skeleton
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build and test the PhotoKit package
        run: swift test --package-path mobile/ios

  ios-xcode:
    name: ios background upload
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build the host and the background upload extension
        run: scripts/ios-xcode.sh

  ios-simulator:
    name: ios simulator backup
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Verified copy on the iOS Simulator
        run: scripts/ios-simulator.sh

  mcp-image:
    name: albumen-mcp image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Validate server.json against the registry schema
        run: |
          python3 -m venv /tmp/schema
          /tmp/schema/bin/pip install jsonschema==4.25.1
          python3 scripts/check-mcp-release.py --self-test
          /tmp/schema/bin/python scripts/check-mcp-release.py

      - name: Build the albumen-mcp image
        run: docker build -t albumen-mcp:ci .

      - name: Check the entrypoint, label, and ExifTool
        run: |
          docker run --rm albumen-mcp:ci --help
          docker image inspect albumen-mcp:ci --format '{{index .Config.Labels "io.modelcontextprotocol.server.name"}}' | grep -Fxq 'io.github.jay-the-maker/albumen'
          docker image inspect albumen-mcp:ci --format '{{json .Config.Entrypoint}}' | grep -Fxq '["albumen-mcp","--library","/library"]'
          docker run --rm --entrypoint exiftool albumen-mcp:ci -ver

      - name: Prove the default library mount cannot change originals
        run: scripts/check-library-mount.sh albumen-mcp:ci

  soak-plan:
    name: soak plan self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      # albumen import-icloud records key metadata with ExifTool.
      - name: Install pinned ExifTool
        run: scripts/install-exiftool.sh

      # docs/xo-52-soak-plan.md (#166): every command of the real-device
      # soak, run on synthetic files in a temp dir. No real photos.
      - name: Run the XO-52 soak script on synthetic files
        run: |
          cargo build --release --locked -p albumen
          ALBUMEN="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys;print(json.load(sys.stdin)["target_directory"])')/release/albumen" \
            bash scripts/xo52-soak.sh selftest

  bench:
    name: performance regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install pinned ExifTool
        run: scripts/install-exiftool.sh

      - name: Compare the scaled run with the stored baseline
        run: cargo run --release --locked -p albumen-bench -- --check

  throughput:
    name: import throughput (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # actions: read lets the report-only compare below fetch the last main
    # run's throughput JSON. Nothing is written.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: ubuntu-24.04
          - os: ubuntu-26.04
            label: ubuntu-26.04
          - os: macos-14
            label: macos-14
          - os: windows-2025
            label: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF checkout on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      # vmtouch reports, before each sample, how much of the source corpus
      # is in the page cache. With no flags it only calls mincore. The bench
      # records "none" when it is missing, as on Windows.
      - name: Install vmtouch for page-cache residency
        if: runner.os != 'Windows'
        run: |
          if [ "$(uname -s)" = Darwin ]; then
            brew install vmtouch || true
          else
            sudo apt-get install -y vmtouch || { sudo apt-get update && sudo apt-get install -y vmtouch; } || true
          fi
          command -v vmtouch || echo "vmtouch unavailable; residency will be none"

      # windows-2025 runners come with more than one disk model, and their
      # raw rates differ by almost 2x. The bench reports this model next to
      # its raw-rate band so a ratio is read against its own disk class.
      - name: Record the disk model under the work directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-PhysicalDisk | Format-Table DeviceId, FriendlyName, MediaType, BusType, Size -AutoSize | Out-String | Write-Host
          $model = "unknown"
          try {
            $letter = (Get-Item $env:GITHUB_WORKSPACE).PSDrive.Name
            $number = (Get-Partition -DriveLetter $letter | Get-Disk).Number
            $disk = Get-PhysicalDisk | Where-Object { $_.DeviceId -eq "$number" } | Select-Object -First 1
            if ($disk) { $model = "$($disk.FriendlyName) $($disk.MediaType) $($disk.BusType)".Trim() }
          } catch {
            Write-Host "disk model lookup failed: $_"
          }
          Write-Host "disk model under ${env:GITHUB_WORKSPACE}: $model"
          "ALBUMEN_DISK_MODEL=$model" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Report only (#138): fetch the last successful main run's throughput
      # JSON for this leg. The bench prints import-cpu-compare from it, and
      # compares only when disk_model and runner image both match. A missing
      # baseline leaves the variable unset; no gate reads the comparison.
      - name: Fetch the main baseline for the disk-class compare (report only)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list -R "${GITHUB_REPOSITORY}" --workflow ci.yml --branch main --status success --event push --limit 1 --json databaseId --jq '.[0].databaseId' || true)"
          if [ -z "${run_id}" ] || [ "${run_id}" = "null" ]; then
            echo "no main baseline run; import-cpu-compare will not print"
            exit 0
          fi
          dir="${RUNNER_TEMP}/throughput-baseline"
          if gh run download "${run_id}" -R "${GITHUB_REPOSITORY}" -n "throughput-json-${{ matrix.label }}" -D "${dir}" && [ -s "${dir}/throughput.json" ]; then
            echo "baseline: main run ${run_id}"
            echo "ALBUMEN_THROUGHPUT_COMPARE_JSON=${dir}/throughput.json" >> "$GITHUB_ENV"
          else
            echo "main run ${run_id} has no throughput-json-${{ matrix.label }} artifact yet"
          fi

      - name: Import 1000 synthetic files and compare with a raw write
        env:
          ALBUMEN_THROUGHPUT_LEG: ${{ matrix.label }}
          ALBUMEN_THROUGHPUT_DIR: ${{ github.workspace }}/throughput-data
        run: |
          df -h "${GITHUB_WORKSPACE}" /tmp || true
          # The corpus is 5 GB of sources plus 5 GB of destination. ubuntu-26.04
          # returned "Disk quota exceeded" for that pair under /tmp. The work
          # directory is the runner volume. On Linux, drop preinstalled
          # toolchains when that volume has less than 25 GB free.
          if [ "$(uname -s)" = Linux ]; then
            free_kb="$(df -k "${GITHUB_WORKSPACE}" | awk 'NR==2 {print $4}')"
            if [ "${free_kb:-0}" -lt 25000000 ]; then
              sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/share/swift || true
              docker system prune -af || true
            fi
            df -h "${GITHUB_WORKSPACE}" || true
          fi
          mkdir -p "${ALBUMEN_THROUGHPUT_DIR}"
          # The bench appends the import CPU scorecard to the step summary.
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            export ALBUMEN_THROUGHPUT_SCORECARD="${GITHUB_STEP_SUMMARY}"
          fi
          cargo run --release --locked -p albumen-bench -- --throughput | tee "${RUNNER_TEMP}/throughput.json"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### import throughput (${{ matrix.label }})"
              echo
              echo '```json'
              cat "${RUNNER_TEMP}/throughput.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The next run's disk-class compare reads this as its baseline.
      - name: Keep this run's throughput JSON for the next compare
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: throughput-json-${{ matrix.label }}
          path: ${{ runner.temp }}/throughput.json
          if-no-files-found: ignore
          retention-days: 30

      # Measurement only (#138): the same import with the sources on another
      # volume, as from a camera card or phone to a different drive. A RAM
      # disk on macOS, tmpfs on Linux; 400 files so the sources fit in RAM.
      # Windows has no RAM disk without a driver, so it is skipped there.
      # The gated 1000-file run above is unchanged; this step reports only.
      - name: Import with the sources on a separate volume (report only)
        if: runner.os != 'Windows'
        continue-on-error: true
        env:
          ALBUMEN_THROUGHPUT_LEG: ${{ matrix.label }}
          ALBUMEN_THROUGHPUT_DIR: ${{ github.workspace }}/throughput-data
          ALBUMEN_THROUGHPUT_FILES: "400"
          ALBUMEN_THROUGHPUT_ALLOW_SMALL: "1"
        run: |
          if [ "$(uname -s)" = Darwin ]; then
            dev="$(hdiutil attach -nomount ram://5000000 | awk '{print $1}')"
            diskutil erasevolume APFS AlbumenSrc "$dev"
            src=/Volumes/AlbumenSrc
          else
            src=/mnt/albumen-src
            sudo mkdir -p "$src"
            sudo mount -t tmpfs -o size=2600m tmpfs "$src"
            sudo chown "$(id -u):$(id -g)" "$src"
          fi
          df -h "$src" "${GITHUB_WORKSPACE}" || true
          mkdir -p "${ALBUMEN_THROUGHPUT_DIR}"
          # The baseline is a same-volume run; do not compare this mode with it.
          unset ALBUMEN_THROUGHPUT_COMPARE_JSON
          ALBUMEN_THROUGHPUT_SOURCE_DIR="$src" cargo run --release --locked -p albumen-bench -- --throughput > "${RUNNER_TEMP}/throughput-separate.json"
          echo "---- same-volume run for comparison: import-source-volume mode=same is in the step above"

  sandbox:
    name: no unexpected egress
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install rootless podman and strace
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns strace
          mkdir -p "${XDG_RUNTIME_DIR:-/tmp/albumen-runtime-$(id -u)}"
          chmod 700 "${XDG_RUNTIME_DIR:-/tmp/albumen-runtime-$(id -u)}"
          podman info --format '{{.Host.Security.Rootless}}' | grep -qx true

      - name: Strace scan and run it with network syscalls denied
        run: scripts/scan-no-network.sh

      - name: Sandbox trial against a copy of the fixtures
        run: scripts/sandbox-trial.sh

      - name: Fail on network connections the command did not name
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          scripts/no-unexpected-egress.sh

  commons-corpus:
    name: Commons corpus round-trip
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ALBUMEN_COMMONS_CORPUS_REQUIRED: "1"
      ALBUMEN_S3_UNAVAILABLE: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install pinned ExifTool
        run: scripts/install-exiftool.sh

      # The runner context is not available in job-level env, so set the path here.
      - name: Corpus directory
        run: echo "ALBUMEN_COMMONS_CORPUS=$RUNNER_TEMP/commons-corpus" >> "$GITHUB_ENV"

      - name: Attribution file matches the manifest
        run: python3 scripts/fetch-commons-corpus.py attribution --check

      # Keyed only by the manifest hash. No restore-keys: a changed manifest
      # always starts from an empty directory.
      - name: Restore the Commons corpus
        id: commons-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/commons-corpus
          key: commons-corpus-v1-${{ hashFiles('corpus/commons.manifest.json') }}

      - name: Download the pinned files (cache miss)
        if: steps.commons-cache.outputs.cache-hit != 'true'
        run: python3 scripts/fetch-commons-corpus.py fetch "$ALBUMEN_COMMONS_CORPUS"

      # Runs on a cache hit too. Any size, SHA-1, or SHA-256 mismatch fails the job.
      - name: Verify size, SHA-1, and SHA-256 against the manifest
        run: python3 scripts/fetch-commons-corpus.py verify "$ALBUMEN_COMMONS_CORPUS"

      - name: Metadata round-trip on every Commons file
        run: cargo test --locked -p albumen-ingest --test commons_corpus -- --nocapture --test-threads=1

  media-corpus:
    name: Media corpus round-trip
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ALBUMEN_MEDIA_CORPUS_REQUIRED: "1"
      ALBUMEN_S3_UNAVAILABLE: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install pinned ExifTool
        run: scripts/install-exiftool.sh

      # The runner context is not available in job-level env, so set the path here.
      - name: Corpus directory
        run: echo "ALBUMEN_MEDIA_CORPUS=$RUNNER_TEMP/media-corpus" >> "$GITHUB_ENV"

      - name: Attribution file matches the manifest
        run: python3 scripts/fetch-commons-corpus.py --corpus media attribution --check

      # Keyed only by the manifest hash. No restore-keys: a changed manifest
      # always starts from an empty directory.
      - name: Restore the media corpus
        id: media-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/media-corpus
          key: media-corpus-v1-${{ hashFiles('corpus/media.manifest.json') }}

      - name: Download the pinned files (cache miss)
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: python3 scripts/fetch-commons-corpus.py --corpus media fetch "$ALBUMEN_MEDIA_CORPUS"

      # Runs on a cache hit too. Any size, SHA-1, or SHA-256 mismatch fails the job.
      - name: Verify size, SHA-1, and SHA-256 against the manifest
        run: python3 scripts/fetch-commons-corpus.py --corpus media verify "$ALBUMEN_MEDIA_CORPUS"

      - name: Metadata round-trip on every media file
        run: cargo test --locked -p albumen-ingest --test commons_corpus media_corpus_round_trip -- --nocapture --test-threads=1

  raw-corpus:
    name: RAW corpus round-trip
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ALBUMEN_RAW_CORPUS_REQUIRED: "1"
      ALBUMEN_S3_UNAVAILABLE: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install pinned ExifTool
        run: scripts/install-exiftool.sh

      # The runner context is not available in job-level env, so set the path here.
      - name: Corpus directory
        run: echo "ALBUMEN_RAW_CORPUS=$RUNNER_TEMP/raw-corpus" >> "$GITHUB_ENV"

      - name: Attribution file matches the manifest
        run: python3 scripts/fetch-commons-corpus.py --corpus raw attribution --check

      # Keyed only by the manifest hash. No restore-keys: a changed manifest
      # always starts from an empty directory.
      - name: Restore the RAW corpus
        id: raw-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/raw-corpus
          key: raw-corpus-v1-${{ hashFiles('corpus/raw.manifest.json') }}

      - name: Download the pinned files (cache miss)
        if: steps.raw-cache.outputs.cache-hit != 'true'
        run: python3 scripts/fetch-commons-corpus.py --corpus raw fetch "$ALBUMEN_RAW_CORPUS"

      # Runs on a cache hit too. Any size, SHA-1, or SHA-256 mismatch fails the job.
      - name: Verify size, SHA-1, and SHA-256 against the manifest
        run: python3 scripts/fetch-commons-corpus.py --corpus raw verify "$ALBUMEN_RAW_CORPUS"

      - name: Metadata round-trip on every RAW file
        run: cargo test --locked -p albumen-ingest --test commons_corpus raw_corpus_round_trip -- --nocapture --test-threads=1

  zero-network:
    name: zero network (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: ubuntu-24.04
          - os: macos-14
            label: macos-14
          - os: windows-2025
            label: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF checkout on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install pinned ExifTool
        shell: bash
        run: scripts/install-exiftool.sh

      - name: Install strace
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y strace

      - name: Prove scan, index, and search make no connections
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/zero-network.sh

      - name: Prove scan, index, and search make no connections
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File scripts/zero-network.ps1

  package-release:
    name: package release archive (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: albumen-linux-x86_64
          - os: macos-14
            label: macos-14
            target: aarch64-apple-darwin
            artifact: albumen-macos-arm64
          - os: windows-2025
            label: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: albumen-windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF checkout on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binaries
        env:
          TARGET: ${{ matrix.target }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/albumen"
          export CARGO_INCREMENTAL=0
          export CARGO_PROFILE_RELEASE_INCREMENTAL=false
          export CARGO_PROFILE_RELEASE_DEBUG=false
          export CARGO_PROFILE_RELEASE_STRIP=symbols
          cargo build --release --locked --target "$TARGET" -p albumen -p albumen-mcp -p albumen-receive

      - name: Package the archive
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: bash scripts/package-release.sh "$TARGET" "$ARTIFACT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
          if-no-files-found: error

  install-quickstart:
    name: install without Rust (${{ matrix.label }})
    needs: package-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: ubuntu-24.04
            artifact: albumen-linux-x86_64
          - os: macos-14
            label: macos-14
            artifact: albumen-macos-arm64
          - os: windows-2025
            label: windows-2025
            artifact: albumen-windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF checkout on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: release-archive

      - name: This job does not install a Rust toolchain
        run: |
          if [ -n "${RUSTUP_TOOLCHAIN:-}" ]; then
            echo "RUSTUP_TOOLCHAIN is set" >&2
            exit 1
          fi
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/check-quickstart.py --self-test
          "$PY" scripts/check-quickstart.py

      - name: Check the installer without a release binary
        run: bash scripts/check-install.sh

      - name: Quickstart to a verified backup
        if: runner.os != 'Windows'
        env:
          ALBUMEN_ARCHIVE: ${{ github.workspace }}/release-archive/${{ matrix.artifact }}.tar.gz
        run: |
          home="$(mktemp -d)"
          export HOME="$home"
          bash scripts/quickstart.sh | tee "$home/quickstart.out"
          grep -q '^verified: ' "$home/quickstart.out"
          grep -q '^source unchanged$' "$home/quickstart.out"

      - name: Check the PowerShell installer
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File scripts/check-install.ps1

      - name: Quickstart to a verified backup on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $profileRoot = Join-Path $env:RUNNER_TEMP 'albumen-quickstart-home'
          New-Item -ItemType Directory -Force -Path $profileRoot | Out-Null
          $local = Join-Path $profileRoot 'AppData\Local'
          New-Item -ItemType Directory -Force -Path $local | Out-Null
          $env:USERPROFILE = $profileRoot
          $env:LOCALAPPDATA = $local
          $env:ALBUMEN_ARCHIVE = Join-Path $env:GITHUB_WORKSPACE 'release-archive\${{ matrix.artifact }}.tar.gz'
          $out = Join-Path $profileRoot 'quickstart.out'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\quickstart.ps1') | Tee-Object -FilePath $out
          if (-not (Select-String -Path $out -Pattern '^verified: ' -Quiet)) { throw 'SHA-256 verification did not print' }
          if (-not (Select-String -Path $out -Pattern '^source unchanged$' -Quiet)) { throw 'source was not reported unchanged' }
