name: macos-binaries

on:
  workflow_dispatch:
    inputs:
      release:
        description: GitHub release tag to attach
        required: true
        default: v0.1.0
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos-arm64:
    name: albumen macOS arm64 binaries
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Build release binaries
        run: cargo build --release --locked -p albumen -p albumen-mcp

      - name: Package albumen and albumen-mcp
        run: |
          stage="$(mktemp -d)"
          cp target/release/albumen target/release/albumen-mcp "$stage/"
          (
            cd "$stage"
            shasum -a 256 albumen albumen-mcp > SHA256SUMS
            tar -czf "$GITHUB_WORKSPACE/albumen-macos-arm64.tar.gz" albumen albumen-mcp SHA256SUMS
          )
          shasum -a 256 albumen-macos-arm64.tar.gz > albumen-macos-arm64.tar.gz.sha256

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release || github.ref_name }}
        run: |
          gh release upload "$TAG" \
            albumen-macos-arm64.tar.gz \
            albumen-macos-arm64.tar.gz.sha256 \
            --repo "${{ github.repository }}" \
            --clobber
