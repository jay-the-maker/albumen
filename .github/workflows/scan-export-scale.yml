name: scan export scale

# Generates synthetic text files on the runner, then times `albumen scan` and
# `albumen export --apply` with scripts/scan-export-scale.py. Each leg records
# seconds per 1,000 files and the peak RSS of each command to a JSON
# artifact. The job fails when scan or export is more than 20 percent slower
# per 1,000 files than the scan_export entry in bench/baseline.json. While that
# entry has "placeholder": true the job warns and does not enforce; the
# placeholder is never a red gate. Nothing generated is committed and no photo
# or media file is read.
#
# Legs: a pull request runs 100,000 files. The weekly cron runs 100,000,
# 380,000 and 1,000,000. The 1,000,000-file leg runs in CI only, never on a
# dev box; a local smoke run uses about 1,000 files. workflow_dispatch takes a
# comma-separated list of file counts.

on:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - ".github/workflows/scan-export-scale.yml"
      - "scripts/scan-export-scale.py"
      - "bench/baseline.json"
      - "ingest/**"
      - "cli/**"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      files:
        description: "Comma-separated file counts, for example 100000,380000"
        type: string
        default: "100000"
      write_baseline:
        description: "Print a new scan_export entry instead of checking"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  legs:
    runs-on: ubuntu-24.04
    outputs:
      files: ${{ steps.legs.outputs.files }}
    steps:
      - uses: actions/checkout@v5
      - id: legs
        env:
          EVENT: ${{ github.event_name }}
          FILES: ${{ inputs.files }}
        run: |
          python3 scripts/scan-export-scale.py --self-test
          echo "files=$(python3 scripts/scan-export-scale.py --legs "$EVENT" --legs-input "$FILES")" >> "$GITHUB_OUTPUT"

  scan-export-scale:
    needs: legs
    name: scan export scale (${{ matrix.files }} files)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        files: ${{ fromJSON(needs.legs.outputs.files) }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Build albumen (release)
        run: cargo build --release --locked -p albumen

      - name: Put exiftool on PATH
        run: echo "$(bash scripts/install-exiftool.sh)" >> "$GITHUB_PATH"

      - name: Scan and export ${{ matrix.files }} synthetic files
        run: |
          mode=--check
          if [ "${{ inputs.write_baseline }}" = "true" ]; then mode=--write; fi
          python3 scripts/scan-export-scale.py --albumen target/release/albumen \
            --files ${{ matrix.files }} --workdir "$RUNNER_TEMP/scan-export-scale" $mode \
            --json-out "$RUNNER_TEMP/scale-${{ matrix.files }}.json" \
            --baseline-out "$RUNNER_TEMP/baseline.json" \
            --runner ubuntu-24.04 --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            | tee "$RUNNER_TEMP/scan-export.txt"
          { echo '```json'; cat "$RUNNER_TEMP/scale-${{ matrix.files }}.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: scale-${{ matrix.files }}
          path: ${{ runner.temp }}/scale-${{ matrix.files }}.json
          if-no-files-found: error

      # The recorded baseline: bench/baseline.json with this run's scan_export,
      # "placeholder" removed, runner and commit SHA set. Uploaded only; no
      # bot commit. Jay copies it into bench/baseline.json when he chooses.
      - if: github.event_name == 'pull_request' && matrix.files == 100000
        uses: actions/upload-artifact@v4
        with:
          name: baseline
          path: ${{ runner.temp }}/baseline.json
          if-no-files-found: error
