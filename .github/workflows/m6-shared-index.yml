            || { echo "::error::no 'M7 NTFS_CHANGETIME' line"; exit 1; }

      - name: Deny-write sharing vs a sync tool's write (printed and asserted)
        # XO 03:36Z (6): FILE_SHARE_READ only would see an open writer, but
        # refuses a writer opening during the check, so change_time() keeps
        # sharing all; this prints how many writes it would have refused.
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --release --locked -p albumen --features test-hooks --bin albumen \
