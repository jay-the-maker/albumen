name: m6 shared index

# Runs on every push to m6-shared-index (GitHub registers a
# workflow_dispatch only once the file is on main, so the push starts the
# binding run), and by hand. The binding Linux result for the M6 shared-index read bars
# (read p95 <= 20 ms, max <= 100 ms) and the kill test, on a GitHub runner.
# The test library is synthetic and generated in a temp dir; nothing is
# committed and no real photo is read.

on:
  push:
    branches: [m6-shared-index, m7-hide-persist, m7-hide-persist-r]
  workflow_dispatch:
    inputs:
      files:
        description: "Library size for X2 and X3"
        default: "380000"
      iters:
        description: "X2 writer iterations"
        default: "100"
      kills:
        description: "X3 kills"
        default: "500"

permissions:
  contents: read

jobs:
  m6:
    name: m6 shared index (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FILES: ${{ github.event.inputs.files || '380000' }}
      ITERS: ${{ github.event.inputs.iters || '100' }}
      KILLS: ${{ github.event.inputs.kills || '500' }}
      # Peak RSS bar for every X2/X3 step: m6-one.sh runs each under /usr/bin/time -v.
      ALBUMEN_M6_MAX_RSS_KB: "339968"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Build the index tests and X1
        id: build
        # Prebuilt here so /usr/bin/time -v in m6-one.sh measures the tests, not rustc.
        run: |
          cargo test --release --locked -p albumen-ingest --test index_shared --no-run
          cargo test --release --locked -p albumen --features test-hooks --test gui_index_x1 --no-run
          cargo test --release --locked -p albumen --features test-hooks --test m7_hide_persist --test m7_timing --no-run

      - name: X2 at 10,000 files, seeds 1-3 (read bars)
        run: |
          for seed in 1 2 3; do
            ALBUMEN_M6_FILES=10000 ALBUMEN_M6_ITERS=1000 ALBUMEN_M6_SEED=$seed ALBUMEN_M6_READ_BARS=1 \
              bash .github/m6-one.sh gui_and_search_tool_share_one_index X2
          done

      - name: X2 at ${{ github.event.inputs.files || '380000' }} files, seeds 1-3 (read bars)
        run: |
          for seed in 1 2 3; do
            ALBUMEN_M6_FILES=$FILES ALBUMEN_M6_ITERS=$ITERS \
              ALBUMEN_M6_SEED=$seed ALBUMEN_M6_READ_BARS=1 \
              bash .github/m6-one.sh gui_and_search_tool_share_one_index X2
          done

      - name: X3 kill mid-write at ${{ github.event.inputs.files || '380000' }} files
        run: |
          ALBUMEN_M6_FILES=$FILES ALBUMEN_M6_KILLS=$KILLS ALBUMEN_M6_SEED=1 \
            bash .github/m6-one.sh kill_mid_write_leaves_old_or_new X3

      - name: X1 GUI + readers under one writer, 10,000 files x 10,000 cycles
        run: |
          # Peak RSS bar on the gui child by its own pid (XO 20:58Z); the
          # tree peak (harness included) is printed as a diagnostic only.
          ALBUMEN_M6_FILES=10000 ALBUMEN_M6_CYCLES=10000 ALBUMEN_M6_SEED=1 M6_TREE_RSS=diag \
            M6_PKG=albumen M6_TEST=gui_index_x1 M6_FEATURES=test-hooks \
            M6_RESULT_MAX="index_read_max_ms=100 gui_child_peak_rss_kb=339968" \
            bash .github/m6-one.sh readers_keep_answering_while_one_writer_saves X1

      - name: M7 hidden photos stay hidden at ${{ github.event.inputs.files || '380000' }} files (M6 bars)
        # Runs even when an X2/X3/X1 step failed (not on cancel or a failed
        # build); the job still fails on them.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # hide_poll_ms (one /api/found hide-line refresh after the listing) is
          # PROVISIONAL and non-blocking: printed ("M7 HIDE_POLL_BAR PROVISIONAL
          # non-blocking ...") until 3+ CI samples exist; not asserted, not gated here.
          # First tile <= 2 s, full listing (ready_ms) <= 60 s, and gui child peak RSS <= 332 MiB, with no hidden photo shown.
          ALBUMEN_M7_FILES=$FILES ALBUMEN_M7_BARS=1 M6_TREE_RSS=diag \
            M6_PKG=albumen M6_TEST=m7_hide_persist M6_FEATURES=test-hooks \
            M6_RESULT_MAX="first_tile_ms=2000 ready_ms=60000 gui_child_peak_rss_kb=339968 hidden_shown=0" \
            bash .github/m6-one.sh hidden_photos_stay_hidden_at_scale M7

      - name: The rest of the M7 hide tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          # The scale and RECHECK_DIAG tests fail in CI without their env var,
          # so they are filtered out here and run in their own steps: 36 + 2 + 5 (XO 04:41Z, FRAGO 06:29Z, 10:42Z race) = 43 here, plus 5 timing tests (4 no-flicker + 1 untrusted-reread) in the m7_timing binary run with --test-threads=1 = 48 (r14 option b; the coarse-ctime test is Unix-only).
          cargo test --release --locked -p albumen --features test-hooks --test m7_hide_persist -- \
            --skip hidden_photos_stay_hidden_at_scale --skip m7_recheck_and_img_diagnostics \
            --skip m7_synced_in --skip m7_unhide_while_pending --skip m7_pending_limit --skip m7_exhausted 2>&1 | tee m7.log
          grep -Eq '^test result: ok\. 36 passed; 0 failed; 0 ignored; 0 measured; 7 filtered out' m7.log \
            || { echo "::error::m7_hide_persist did not run exactly 36 tests green (7 filtered out)"; exit 1; }

      - name: M7 untrusted tombstone re-read cost (diagnostic; XO FRAGO 09:28Z (b))
        # Product Lead 0926Z gate D2: a real SHOW tombstone whose stamp is
        # never trusted is re-read on every request (no test hook). Fails
        # unless exactly 1 passed and the M7 UNTRUSTED_REREADS line printed.
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --release --locked -p albumen --features test-hooks --test m7_timing \
            an_untrusted_real_tombstone_reread_cost_is_measured -- --exact --nocapture --test-threads=1 2>&1 | tee m7-untrusted.log
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; 4 filtered out' m7-untrusted.log \
            || { echo "::error::the untrusted re-read test did not run exactly 1 test green"; exit 1; }
          grep -E 'M7 UNTRUSTED_REREADS key=ctime measured=yes tombstones=256 requests=10 reads=2560 ' m7-untrusted.log \
            || { echo "::error::no M7 UNTRUSTED_REREADS line"; exit 1; }

      - name: M7 no-flicker acceptance (ctime, coarse 2 s window, worker error, worker panic; merge-blocking)
        # Product Lead doc 1Ak9gqDUQp4BfibMVlw4fd4qLw8CKUxPH section 2 (XO 04:08Z):
        # a folder held pending by ALBUMEN_TEST_RELIST_GATE; no visible photo
        # disappears, the new hide never shows, new photos show within 1 s
        # of the release, withheld p95 and max <= 1 s. Exactly 4 passed and
        # 0 ignored, and one NO_FLICKER line per variant.
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --release --locked -p albumen --features test-hooks --test m7_timing \
            m7_no_flicker -- --nocapture --test-threads=1 2>&1 | tee m7-nf.log
          grep -Eq '^test result: ok\. 4 passed; 0 failed; 0 ignored; 0 measured; 1 filtered out' m7-nf.log \
            || { echo "::error::the no-flicker tests did not run exactly 4 green with 0 ignored"; exit 1; }
          for v in platform coarse worker_error worker_panic; do
            grep -E "^(test m7_no_flicker[a-z_]* \.\.\. )?M7 NO_FLICKER variant=$v key=ctime .* disappearances=0 h_shown=0 " m7-nf.log \
              || { echo "::error::no passing M7 NO_FLICKER line for $v"; exit 1; }
          done
          grep -Ec '^(test m7_no_flicker[a-z_]* \.\.\. )?M7 NO_FLICKER_INLINE variant=' m7-nf.log | grep -qx 4 \
            || { echo "::error::expected 4 M7 NO_FLICKER_INLINE lines (keep_shown and set build under the cap)"; exit 1; }
          # XO 09:12Z: per-request tombstone file touches and lock wait per variant.
          grep -E 'M7 NO_FLICKER_REQ variant=' m7-nf.log || { echo "::error::no M7 NO_FLICKER_REQ lines"; exit 1; }
          grep -Ec '^(test m7_no_flicker[a-z_]* \.\.\. )?M7 NO_FLICKER_REWALKS variant=[a-z_]+ generation=22 max=22$' m7-nf.log | grep -qx 4 \
            || { echo "::error::expected 4 M7 NO_FLICKER_REWALKS lines with generation == 22"; exit 1; }

      - name: M7 timing tests under background CPU load (print-only; FRAGO 10:22Z (3))
        # Not a gate: the m7_timing binary run once more, serially and then
        # with the default thread count, while one busy loop per CPU runs,
        # printing each test's result and the inline step breakdown
        # (wall vs thread CPU, involuntary switches, sub-phases) so a
        # load-only failure can be told from extra work. Never fails.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          pids=""
          # The busy loops never outlive this step (XO FRAGO 10:44Z (E)):
          # killed on any exit, and timeout caps each at 900 s regardless.
          trap 'kill $pids 2>/dev/null; wait $pids 2>/dev/null' EXIT
          for i in $(seq 1 "$(nproc)"); do timeout 900 bash -c 'while :; do :; done' & pids="$pids $!"; done
          for a in --test-threads=1 --test-threads=4; do
            echo "== m7_timing under load, $a"
            cargo test --release --locked -p albumen --features test-hooks --test m7_timing -- --nocapture $a 2>&1 \
              | grep -E '^test |test result|M7 NO_FLICKER_INLINE|M7 UNTRUSTED_REREADS|panicked|inline work' || true
          done
          exit 0

      - name: M7 synced-in photos, unhide while pending, PENDING_LIMIT and exhausted panics (XO 04:41Z; merge-blocking)
        # Synced-in photos show with no unhide or scan; a photo unhidden while
        # its folder is pending shows once confirmed; a folder hung past 10 s
        # is logged and sent again with nothing new showing; a listing that
        # panics 3 times keeps shown photos and is sent again after a backoff.
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --release --locked -p albumen --features test-hooks --test m7_hide_persist \
            -- m7_synced_in m7_unhide_while_pending m7_pending_limit m7_exhausted --nocapture --test-threads=1 2>&1 | tee m7-r2.log
          grep -Eq '^test result: ok\. 5 passed; 0 failed; 0 ignored; 0 measured; 38 filtered out' m7-r2.log \
            || { echo "::error::the XO 04:41Z tests did not run exactly 5 green with 0 ignored"; exit 1; }
          for l in SYNCED_IN UNHIDE_WHILE_PENDING PENDING_LIMIT EXHAUSTED; do
            grep -E "^(test m7_[a-z_]* \.\.\. )?M7 $l " m7-r2.log || { echo "::error::no M7 $l line"; exit 1; }
          done

      - name: M7 re-check and /img diagnostics at ${{ github.event.inputs.files || '380000' }} files (bar re-check p95 <= 10 ms, max <= 100 ms; withheld p95 and max <= 1 s)
        # Blocking: prints "M7 RECHECK_DIAG tombstones=N ... recheck_p95_ms ... img_p95_ms"
        # and "M7 WITHHELD ..." for 0, 1k and 10k tombstones (100 re-check
        # samples each, 20 withheld samples); fails unless exactly 1 passed,
        # 3+ RECHECK_DIAG lines printed, every line meets p95 <= 10 ms and
        # max <= 100 ms, and every WITHHELD line has withheld and UI p95 and
        # max <= 1 s.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          ALBUMEN_M7_RECHECK_FILES=$FILES ALBUMEN_M7_RECHECK_TOMBSTONES=0,1000,10000 \
            cargo test --release --locked -p albumen --features test-hooks --test m7_hide_persist \
            m7_recheck_and_img_diagnostics -- --exact --nocapture 2>&1 | tee m7-recheck.log
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; 42 filtered out' m7-recheck.log \
            || { echo "::error::m7_recheck_and_img_diagnostics did not run exactly 1 test green"; exit 1; }
          n=$(grep -Ec '^M7 RECHECK_DIAG files=' m7-recheck.log || true)
          [ "$n" -ge 3 ] || { echo "::error::expected >= 3 M7 RECHECK_DIAG lines (one per tombstone level), got $n"; exit 1; }
          grep -E '^M7 RECHECK_DIAG' m7-recheck.log
          # XO 03:36Z (3): withheld time (server, and as the page sees it
          # through its 200 ms poll) p95 and max <= 1 s, checked by the bar
          # script on every M7 WITHHELD line (no line fails it).
          grep -E '^M7 WITHHELD' m7-recheck.log
          # XO 02:53Z/03:09Z bar (blocking): both fields required on every line,
          # p95 <= 10 ms and max <= 100 ms over ALL samples.
          bash .github/m7-recheck-bar.sh m7-recheck.log

      - name: M7 /api/found at 50000 files on Linux (bar p95 <= 20 ms, max <= 100 ms at 10k tombstones)
        # XO 08:24Z (a), D2: the step above runs FILES (380000 by default),
        # so its files=50000 assert never matched (n=0). This run is at
        # 50000 files, where the /api/found bar is defined, with the same
        # assert and the same re-check bar script.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          ALBUMEN_M7_RECHECK_FILES=50000 ALBUMEN_M7_RECHECK_TOMBSTONES=0,1000,10000 \
            cargo test --release --locked -p albumen --features test-hooks --test m7_hide_persist \
            m7_recheck_and_img_diagnostics -- --exact --nocapture 2>&1 | tee m7-found-50k.log
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; 42 filtered out' m7-found-50k.log \
            || { echo "::error::m7_recheck_and_img_diagnostics at 50k did not run exactly 1 test green"; exit 1; }
          grep -E '^M7 POLL' m7-found-50k.log
          # Product Lead 0905Z (4): sync2s_max is held to the existing re-check
          # max (100 ms); the first 2 s after a sync are not exempt.
          grep -E '^M7 RECHECK_SYNC_REQ' m7-found-50k.log || true
          grep -E '^M7 RECHECK_SPLIT' m7-found-50k.log
          awk '/^M7 RECHECK_SPLIT files=/{n++; delete v; for(i=1;i<=NF;i++){split($i,kv,"="); v[kv[1]]=kv[2]} if(v["sync2s_max_ms"]!~/^[0-9.]+$/||v["sync2s_max_ms"]+0>100) bad++} END{exit !(n>=3 && bad==0)}' m7-found-50k.log \
            || { echo "::error::sync2s_max over 100 ms (or missing) in m7-found-50k.log"; exit 1; }
          # Product Lead 07:03Z (merge-blocking): page-path /api/found at
          # 50k with 10k tombstones, >= 100 samples, p95 <= 20 ms, max <= 100 ms.
          awk '/^M7 POLL files=50000 tombstones=10000 samples=[0-9]+ path=\/api\/found /{n++; for(i=1;i<=NF;i++){split($i,kv,"="); v[kv[1]]=kv[2]} if(v["samples"]<100||v["p95_ms"]>20||v["max_ms"]>100) bad++} END{exit !(n>=1 && bad==0)}' m7-found-50k.log \
            || { echo "::error::/api/found bar missed (50k/10k: samples >= 100, p95 <= 20 ms, max <= 100 ms)"; grep -E '^M7 POLL' m7-found-50k.log; exit 1; }
          bash .github/m7-recheck-bar.sh m7-found-50k.log

      - name: S3 export against MinIO (scripts/with-minio.sh)
        run: |
          set -o pipefail
          scripts/with-minio.sh bash -c 'test -n "${ALBUMEN_S3_ENDPOINT:-}" && test -z "${ALBUMEN_S3_UNAVAILABLE:-}" && cargo test --release --locked -p albumen-ingest --lib export::tests::s3_export_skips_identical_objects_and_verifies' 2>&1 | tee s3.log
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored' s3.log \
            || { echo "::error::the S3 test did not run against MinIO"; exit 1; }

      - name: two_copy_s3 against MinIO (scripts/with-minio.sh, must really run)
        run: |
          # Pinned MinIO binary as a separate local process (no Docker). Fails
          # if S3 is unavailable, if the test skipped, or unless exactly 1 passed.
          set -o pipefail
          scripts/with-minio.sh bash -c 'test -n "${ALBUMEN_S3_ENDPOINT:-}" && test -z "${ALBUMEN_S3_UNAVAILABLE:-}" && cargo test --release --locked -p albumen --test two_copy_s3 -- --nocapture --test-threads=1' 2>&1 | tee two_copy_s3.log
          if grep -q 'SKIPPED two_copy_s3' two_copy_s3.log; then
            echo "::error::two_copy_s3 skipped; it must run against MinIO"; exit 1
          fi
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored' two_copy_s3.log \
            || { echo "::error::two_copy_s3 did not run exactly 1 test green against MinIO"; exit 1; }

      - name: The rest of the index tests
        run: |
          set -o pipefail
          cargo test --release --locked -p albumen-ingest --test index_shared 2>&1 | tee rest.log
          grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored' rest.log \
            || { echo "::error::index_shared ran no tests or ignored some"; exit 1; }

      - name: M6 INVALID counter
        if: always()
        run: |
          touch m6-invalid-counter.log
          echo "M6 INVALID_COUNTER_SUMMARY invalid=$(grep -c 'outcome=INVALID' m6-invalid-counter.log || true) green_after_rerun=$(grep -c 'outcome=GREEN_AFTER_RERUN' m6-invalid-counter.log || true) attempts=$(grep -vc 'GREEN_AFTER_RERUN' m6-invalid-counter.log || true)"
          cat m6-invalid-counter.log

      - name: Upload the INVALID counter log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-invalid-counter-${{ github.sha }}
          path: m6-invalid-counter.log
          if-no-files-found: warn

  m7-windows:
    # M7 hide tests on Windows: the non-unix stamp key (folder entry count,
    # tombstone names and sizes, tombstone content hash) and the
    # FILE_FLAG_BACKUP_SEMANTICS set_mtime helper. The 380k scale bars stay
    # on Linux (the scale test skips without ALBUMEN_M7_FILES).
    name: m7 hide tests (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF checkout on Windows
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      # No exiftool or ffmpeg: the M7 tests use synthetic files and pass on
      # the box with an empty PATH (gui.rs needs exiftool; it is not run here).
      - name: M7 hide tests
        run: |
          set -o pipefail
          # The scale and RECHECK_DIAG tests fail in CI without their env var,
          # so they are filtered out here and run in their own steps: 35 + 2 + 5 (XO 04:41Z, FRAGO 06:29Z, 10:42Z race) = 42 here, plus 5 timing tests (4 no-flicker + 1 untrusted-reread) in the m7_timing binary run with --test-threads=1 = 47 (r14 option b).
          cargo test --release --locked -p albumen --features test-hooks --test m7_hide_persist -- \
            --skip hidden_photos_stay_hidden_at_scale --skip m7_recheck_and_img_diagnostics \
            --skip m7_synced_in --skip m7_unhide_while_pending --skip m7_pending_limit --skip m7_exhausted 2>&1 | tee m7.log
          grep -Eq '^test result: ok\. 35 passed; 0 failed; 0 ignored; 0 measured; 7 filtered out' m7.log \
            || { echo "::error::m7_hide_persist did not run exactly 35 tests green (7 filtered out) on Windows"; exit 1; }

      - name: M7 untrusted tombstone re-read cost (diagnostic; XO FRAGO 09:28Z (b))
        # Product Lead 0926Z gate D2: a real SHOW tombstone whose stamp is
        # never trusted is re-read on every request (no test hook). Fails
        # unless exactly 1 passed and the M7 UNTRUSTED_REREADS line printed.
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --release --locked -p albumen --features test-hooks --test m7_timing \
            an_untrusted_real_tombstone_reread_cost_is_measured -- --exact --nocapture --test-threads=1 2>&1 | tee m7-untrusted.log
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; 4 filtered out' m7-untrusted.log \
            || { echo "::error::the untrusted re-read test did not run exactly 1 test green"; exit 1; }
          grep -E 'M7 UNTRUSTED_REREADS key=[a-z_]+ measured=(yes|no) tombstones=256 ' m7-untrusted.log \
            || { echo "::error::no M7 UNTRUSTED_REREADS line"; exit 1; }

      - name: M7 no-flicker acceptance (changetime, coarse 2 s window, worker error, worker panic; merge-blocking)
        # Product Lead doc 1Ak9gqDUQp4BfibMVlw4fd4qLw8CKUxPH section 2 (XO 04:08Z):
        # a folder held pending by ALBUMEN_TEST_RELIST_GATE; no visible photo
        # disappears, the new hide never shows, new photos show within 1 s
        # of the release, withheld p95 and max <= 1 s. Exactly 4 passed and
        # 0 ignored, and one NO_FLICKER line per variant.
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --release --locked -p albumen --features test-hooks --test m7_timing \
            m7_no_flicker -- --nocapture --test-threads=1 2>&1 | tee m7-nf.log
          grep -Eq '^test result: ok\. 4 passed; 0 failed; 0 ignored; 0 measured; 1 filtered out' m7-nf.log \
            || { echo "::error::the no-flicker tests did not run exactly 4 green with 0 ignored"; exit 1; }
          for v in platform coarse worker_error worker_panic; do
            grep -E "^(test m7_no_flicker[a-z_]* \.\.\. )?M7 NO_FLICKER variant=$v key=changetime .* disappearances=0 h_shown=0 " m7-nf.log \
              || { echo "::error::no passing M7 NO_FLICKER line for $v"; exit 1; }
          done
          grep -Ec '^(test m7_no_flicker[a-z_]* \.\.\. )?M7 NO_FLICKER_INLINE variant=' m7-nf.log | grep -qx 4 \
            || { echo "::error::expected 4 M7 NO_FLICKER_INLINE lines (keep_shown and set build under the cap)"; exit 1; }
          # XO 09:12Z: per-request tombstone file touches and lock wait per variant.
          grep -E 'M7 NO_FLICKER_REQ variant=' m7-nf.log || { echo "::error::no M7 NO_FLICKER_REQ lines"; exit 1; }
          grep -Ec '^(test m7_no_flicker[a-z_]* \.\.\. )?M7 NO_FLICKER_REWALKS variant=[a-z_]+ generation=22 max=22$' m7-nf.log | grep -qx 4 \
            || { echo "::error::expected 4 M7 NO_FLICKER_REWALKS lines with generation == 22"; exit 1; }

      - name: M7 synced-in photos, unhide while pending, PENDING_LIMIT and exhausted panics (XO 04:41Z; merge-blocking)
        # Synced-in photos show with no unhide or scan; a photo unhidden while
        # its folder is pending shows once confirmed; a folder hung past 10 s
        # is logged and sent again with nothing new showing; a listing that
        # panics 3 times keeps shown photos and is sent again after a backoff.
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --release --locked -p albumen --features test-hooks --test m7_hide_persist \
            -- m7_synced_in m7_unhide_while_pending m7_pending_limit m7_exhausted --nocapture --test-threads=1 2>&1 | tee m7-r2.log
          grep -Eq '^test result: ok\. 5 passed; 0 failed; 0 ignored; 0 measured; 37 filtered out' m7-r2.log \
            || { echo "::error::the XO 04:41Z tests did not run exactly 5 green with 0 ignored"; exit 1; }
          for l in SYNCED_IN UNHIDE_WHILE_PENDING PENDING_LIMIT EXHAUSTED; do
            grep -E "^(test m7_[a-z_]* \.\.\. )?M7 $l " m7-r2.log || { echo "::error::no M7 $l line"; exit 1; }
          done

      - name: M7 change key is ChangeTime (printed and asserted)
        # XO 03:12Z: the step above runs without --nocapture, so the test's
        # "M7 change key" line never reached the log. Run it alone with
        # --nocapture and require the line: key=changetime, keys taken, none failed.
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --release --locked -p albumen --features test-hooks --test m7_hide_persist \
            the_change_key_is_the_platform_key_with_no_fallback -- --exact --nocapture 2>&1 | tee m7-key.log
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out' m7-key.log \
            || { echo "::error::the change-key test did not run exactly 1 test green"; exit 1; }
          grep -E '^M7 change key: key=changetime changetime_keys=[1-9][0-9]* key_failures=0 ' m7-key.log \
            || { echo "::error::no 'M7 change key: key=changetime changetime_keys>0 key_failures=0' line"; exit 1; }

      - name: NTFS ChangeTime while a writer holds a tombstone open (printed and asserted)
        # XO 03:22Z (2): MS docs only promise file times at handle close.
        # Prints ChangeTime/LastWriteTime before, while open and after close;
        # asserts the new bytes are seen at once and the stamp moves at close.
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --release --locked -p albumen --features test-hooks --bin albumen \
            gui::tests::ntfs_changetime_while_a_writer_is_open -- --exact --nocapture 2>&1 | tee m7-ntfs.log
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out' m7-ntfs.log \
