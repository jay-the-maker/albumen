name: m6 shared index

# Runs on every push to m6-shared-index (GitHub registers a
# workflow_dispatch only once the file is on main, so the push starts the
# binding run), and by hand. The binding Linux result for the M6 shared-index read bars
# (read p95 <= 20 ms, max <= 100 ms) and the kill test, on a GitHub runner.
# The test library is synthetic and generated in a temp dir; nothing is
# committed and no real photo is read.

on:
  push:
    # m6-x2-chunk-hash: DIAGNOSTIC ONLY, NEVER BINDING. Its runs collect the
    # X2 READ_OVER_20MS / READ_CPU lines and ticker-gap timestamps for the
    # intermittent X2 slow read; only m6-shared-index gives the binding result.
    branches: [m6-shared-index, m6-x2-chunk-hash]
  workflow_dispatch:
    inputs:
      files:
        description: "Library size for X2 and X3"
        default: "380000"
      iters:
        description: "X2 writer iterations"
        default: "100"
      kills:
        description: "X3 kills"
        default: "500"

permissions:
  contents: read

jobs:
  m6:
    # On m6-x2-chunk-hash the check name says it is diagnostic; everywhere
    # else it renders exactly as before: "m6 shared index (ubuntu-24.04)".
    name: ${{ github.ref_name == 'm6-x2-chunk-hash' && 'm6 shared index (ubuntu-24.04) (DIAGNOSTIC not binding)' || 'm6 shared index (ubuntu-24.04)' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FILES: ${{ github.event.inputs.files || '380000' }}
      ITERS: ${{ github.event.inputs.iters || '100' }}
      KILLS: ${{ github.event.inputs.kills || '500' }}
      # Peak RSS bar for every X2/X3 step: m6-one.sh runs each under /usr/bin/time -v.
      ALBUMEN_M6_MAX_RSS_KB: "339968"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Diagnostic branch notice
        if: github.ref_name == 'm6-x2-chunk-hash'
        run: |
          echo "M6 DIAGNOSTIC branch, not binding"
          echo "::notice::M6 DIAGNOSTIC branch (m6-x2-chunk-hash), not binding"

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Build the index tests and X1
        # Prebuilt here so /usr/bin/time -v in m6-one.sh measures the tests, not rustc.
        run: |
          cargo test --release --locked -p albumen-ingest --test index_shared --no-run
          cargo test --release --locked -p albumen --test gui_index_x1 --no-run

      - name: Index check cache unit tests
        # ci.yml runs every lib test, but only on main and pull requests; the
        # full --lib needs exiftool, which this job does not install.
        run: |
          set -o pipefail
          cargo test --release --locked -p albumen-ingest --lib check_cache 2>&1 | tee check-cache.log
          grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored' check-cache.log \
            || { echo "::error::check_cache ran no tests or ignored some"; exit 1; }

      - name: X2 at 10,000 files, seeds 1-3 (read bars)
        run: |
          for seed in 1 2 3; do
            ALBUMEN_M6_FILES=10000 ALBUMEN_M6_ITERS=1000 ALBUMEN_M6_SEED=$seed ALBUMEN_M6_READ_BARS=1 \
              bash .github/m6-one.sh gui_and_search_tool_share_one_index X2
          done

      - name: X2 at ${{ github.event.inputs.files || '380000' }} files, seeds 1-3 (read bars)
        run: |
          for seed in 1 2 3; do
            ALBUMEN_M6_FILES=$FILES ALBUMEN_M6_ITERS=$ITERS \
              ALBUMEN_M6_SEED=$seed ALBUMEN_M6_READ_BARS=1 \
              bash .github/m6-one.sh gui_and_search_tool_share_one_index X2
          done

      - name: X3 kill mid-write at ${{ github.event.inputs.files || '380000' }} files
        run: |
          ALBUMEN_M6_FILES=$FILES ALBUMEN_M6_KILLS=$KILLS ALBUMEN_M6_SEED=1 \
            bash .github/m6-one.sh kill_mid_write_leaves_old_or_new X3

      - name: X1 GUI + readers under one writer, 10,000 files x 10,000 cycles
        run: |
          # Peak RSS bar on the gui child by its own pid (XO 20:58Z); the
          # tree peak (harness included) is printed as a diagnostic only.
          ALBUMEN_M6_FILES=10000 ALBUMEN_M6_CYCLES=10000 ALBUMEN_M6_SEED=1 M6_TREE_RSS=diag \
            M6_PKG=albumen M6_TEST=gui_index_x1 \
            M6_RESULT_MAX="index_read_max_ms=100 gui_child_peak_rss_kb=339968" \
            bash .github/m6-one.sh readers_keep_answering_while_one_writer_saves X1

      - name: The rest of the index tests
        run: |
          set -o pipefail
          cargo test --release --locked -p albumen-ingest --test index_shared 2>&1 | tee rest.log
          grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored' rest.log \
            || { echo "::error::index_shared ran no tests or ignored some"; exit 1; }

      - name: M6 INVALID counter
        if: always()
        run: |
          touch m6-invalid-counter.log
          echo "M6 INVALID_COUNTER_SUMMARY invalid=$(grep -c 'outcome=INVALID' m6-invalid-counter.log || true) green_after_rerun=$(grep -c 'outcome=GREEN_AFTER_RERUN' m6-invalid-counter.log || true) attempts=$(grep -vc 'GREEN_AFTER_RERUN' m6-invalid-counter.log || true)"
          cat m6-invalid-counter.log

      - name: Upload the INVALID counter log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-invalid-counter-${{ github.sha }}
          path: m6-invalid-counter.log
          if-no-files-found: warn
