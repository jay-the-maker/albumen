name: m6 shared index

# Runs on every push to m6-shared-index (GitHub registers a
# workflow_dispatch only once the file is on main, so the push starts the
# binding run), and by hand. The binding Linux result for the M6 shared-index read bars
# (read p95 <= 20 ms, max <= 100 ms) and the kill test, on a GitHub runner.
# The test library is synthetic and generated in a temp dir; nothing is
# committed and no real photo is read.

on:
  push:
    branches: [m6-shared-index, m7-hide-persist, m7-hide-persist-r]
  workflow_dispatch:
    inputs:
      files:
        description: "Library size for X2 and X3"
        default: "380000"
      iters:
        description: "X2 writer iterations"
        default: "100"
      kills:
        description: "X3 kills"
        default: "500"

permissions:
  contents: read

jobs:
  m6:
    name: m6 shared index (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FILES: ${{ github.event.inputs.files || '380000' }}
      ITERS: ${{ github.event.inputs.iters || '100' }}
      KILLS: ${{ github.event.inputs.kills || '500' }}
      # Peak RSS bar for every X2/X3 step: m6-one.sh runs each under /usr/bin/time -v.
      ALBUMEN_M6_MAX_RSS_KB: "339968"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Build the index tests and X1
        # Prebuilt here so /usr/bin/time -v in m6-one.sh measures the tests, not rustc.
        run: |
          cargo test --release --locked -p albumen-ingest --test index_shared --no-run
          cargo test --release --locked -p albumen --test gui_index_x1 --no-run
          cargo test --release --locked -p albumen --test m7_hide_persist --no-run

      - name: X2 at 10,000 files, seeds 1-3 (read bars)
        run: |
          for seed in 1 2 3; do
            ALBUMEN_M6_FILES=10000 ALBUMEN_M6_ITERS=1000 ALBUMEN_M6_SEED=$seed ALBUMEN_M6_READ_BARS=1 \
              bash .github/m6-one.sh gui_and_search_tool_share_one_index X2
          done

      - name: X2 at ${{ github.event.inputs.files || '380000' }} files, seeds 1-3 (read bars)
        run: |
          for seed in 1 2 3; do
            ALBUMEN_M6_FILES=$FILES ALBUMEN_M6_ITERS=$ITERS \
              ALBUMEN_M6_SEED=$seed ALBUMEN_M6_READ_BARS=1 \
              bash .github/m6-one.sh gui_and_search_tool_share_one_index X2
          done

      - name: X3 kill mid-write at ${{ github.event.inputs.files || '380000' }} files
        run: |
          ALBUMEN_M6_FILES=$FILES ALBUMEN_M6_KILLS=$KILLS ALBUMEN_M6_SEED=1 \
            bash .github/m6-one.sh kill_mid_write_leaves_old_or_new X3

      - name: X1 GUI + readers under one writer, 10,000 files x 10,000 cycles
        run: |
          # Peak RSS bar on the gui child by its own pid (XO 20:58Z); the
          # tree peak (harness included) is printed as a diagnostic only.
          ALBUMEN_M6_FILES=10000 ALBUMEN_M6_CYCLES=10000 ALBUMEN_M6_SEED=1 M6_TREE_RSS=diag \
            M6_PKG=albumen M6_TEST=gui_index_x1 \
            M6_RESULT_MAX="index_read_max_ms=100 gui_child_peak_rss_kb=339968" \
            bash .github/m6-one.sh readers_keep_answering_while_one_writer_saves X1

      - name: M7 hidden photos stay hidden at ${{ github.event.inputs.files || '380000' }} files (M6 bars)
        run: |
          # hide_poll_ms (one /api/found hide-line refresh after the listing) is
          # PROVISIONAL and non-blocking: printed ("M7 HIDE_POLL_BAR PROVISIONAL
          # non-blocking ...") until 3+ CI samples exist; not asserted, not gated here.
          # First tile <= 2 s, full listing (ready_ms) <= 60 s, and gui child peak RSS <= 332 MiB, with no hidden photo shown.
          ALBUMEN_M7_FILES=$FILES ALBUMEN_M7_BARS=1 M6_TREE_RSS=diag \
            M6_PKG=albumen M6_TEST=m7_hide_persist \
            M6_RESULT_MAX="first_tile_ms=2000 ready_ms=60000 gui_child_peak_rss_kb=339968 hidden_shown=0" \
            bash .github/m6-one.sh hidden_photos_stay_hidden_at_scale M7

      - name: The rest of the M7 hide tests
        run: |
          set -o pipefail
          cargo test --release --locked -p albumen --test m7_hide_persist 2>&1 | tee m7.log
          # 19 tests: the scale test skips here (no ALBUMEN_M7_FILES) and counts as passed.
          grep -Eq '^test result: ok\. 19 passed; 0 failed; 0 ignored' m7.log \
            || { echo "::error::m7_hide_persist did not run exactly 19 tests green"; exit 1; }

      - name: M7 re-check and /img diagnostics at ${{ github.event.inputs.files || '380000' }} files (print-only)
        # Non-blocking: prints "M7 RECHECK_DIAG tombstones=N ... recheck_p95_ms ... img_p95_ms"
        # for 0, 1k and 10k tombstones; nothing is gated on it.
        continue-on-error: true
        run: |
          ALBUMEN_M7_RECHECK_FILES=$FILES ALBUMEN_M7_RECHECK_TOMBSTONES=0,1000,10000 \
            cargo test --release --locked -p albumen --test m7_hide_persist \
            m7_recheck_and_img_diagnostics -- --exact --nocapture 2>&1 | tee m7-recheck.log
          grep -E '^M7 RECHECK_DIAG' m7-recheck.log || true

      - name: S3 export against MinIO (scripts/with-minio.sh)
        run: |
          set -o pipefail
          scripts/with-minio.sh bash -c 'test -n "${ALBUMEN_S3_ENDPOINT:-}" && test -z "${ALBUMEN_S3_UNAVAILABLE:-}" && cargo test --release --locked -p albumen-ingest --lib export::tests::s3_export_skips_identical_objects_and_verifies' 2>&1 | tee s3.log
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored' s3.log \
            || { echo "::error::the S3 test did not run against MinIO"; exit 1; }

      - name: two_copy_s3 against MinIO (scripts/with-minio.sh, must really run)
        run: |
          # Pinned MinIO binary as a separate local process (no Docker). Fails
          # if S3 is unavailable, if the test skipped, or unless exactly 1 passed.
          set -o pipefail
          scripts/with-minio.sh bash -c 'test -n "${ALBUMEN_S3_ENDPOINT:-}" && test -z "${ALBUMEN_S3_UNAVAILABLE:-}" && cargo test --release --locked -p albumen --test two_copy_s3 -- --nocapture --test-threads=1' 2>&1 | tee two_copy_s3.log
          if grep -q 'SKIPPED two_copy_s3' two_copy_s3.log; then
            echo "::error::two_copy_s3 skipped; it must run against MinIO"; exit 1
          fi
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored' two_copy_s3.log \
            || { echo "::error::two_copy_s3 did not run exactly 1 test green against MinIO"; exit 1; }

      - name: The rest of the index tests
        run: |
          set -o pipefail
          cargo test --release --locked -p albumen-ingest --test index_shared 2>&1 | tee rest.log
          grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored' rest.log \
            || { echo "::error::index_shared ran no tests or ignored some"; exit 1; }

      - name: M6 INVALID counter
        if: always()
        run: |
          touch m6-invalid-counter.log
          echo "M6 INVALID_COUNTER_SUMMARY invalid=$(grep -c 'outcome=INVALID' m6-invalid-counter.log || true) green_after_rerun=$(grep -c 'outcome=GREEN_AFTER_RERUN' m6-invalid-counter.log || true) attempts=$(grep -vc 'GREEN_AFTER_RERUN' m6-invalid-counter.log || true)"
          cat m6-invalid-counter.log

      - name: Upload the INVALID counter log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-invalid-counter-${{ github.sha }}
          path: m6-invalid-counter.log
          if-no-files-found: warn

  m7-windows:
    # M7 hide tests on Windows: the non-unix stamp key (folder entry count,
    # tombstone names and sizes, tombstone content hash) and the
    # FILE_FLAG_BACKUP_SEMANTICS set_mtime helper. The 380k scale bars stay
    # on Linux (the scale test skips without ALBUMEN_M7_FILES).
    name: m7 hide tests (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF checkout on Windows
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      # No exiftool or ffmpeg: the M7 tests use synthetic files and pass on
      # the box with an empty PATH (gui.rs needs exiftool; it is not run here).
      - name: M7 hide tests
        run: |
          set -o pipefail
          cargo test --release --locked -p albumen --test m7_hide_persist 2>&1 | tee m7.log
          # 19 tests: the scale test skips here (no ALBUMEN_M7_FILES) and counts as passed.
          grep -Eq '^test result: ok\. 19 passed; 0 failed; 0 ignored' m7.log \
            || { echo "::error::m7_hide_persist did not run exactly 19 tests green on Windows"; exit 1; }

      - name: M7 re-check and /img diagnostics at 50,000 files (print-only)
        # Non-blocking. 50k, not 380k: writing and listing 380k files on a
        # Windows runner would take a large share of the job; 50k keeps it
        # short. Raise it once a run shows the time.
        continue-on-error: true
        run: |
          ALBUMEN_M7_RECHECK_FILES=50000 ALBUMEN_M7_RECHECK_TOMBSTONES=0,1000,10000 \
            cargo test --release --locked -p albumen --test m7_hide_persist \
            m7_recheck_and_img_diagnostics -- --exact --nocapture 2>&1 | tee m7-recheck.log
          grep -E '^M7 RECHECK_DIAG' m7-recheck.log || true
