      - name: M7 re-check and /img diagnostics at 50,000 files (bar p95 <= 10 ms, max <= 100 ms)
        # Blocking (XO 03:22Z; Product Lead: max <= 100 ms at k=0 after a
        # 10k-hide sync, not relaxed). 50k, not 380k: writing and listing
        # 380k files on a Windows runner would take a large share of the job.
        # Fails unless exactly 1 passed, 3+ RECHECK_DIAG lines printed, and
        # every line meets p95 <= 10 ms and max <= 100 ms.
        # No separate build step on Windows: the M7 hide tests step builds.
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          ALBUMEN_M7_RECHECK_FILES=50000 ALBUMEN_M7_RECHECK_TOMBSTONES=0,1000,10000 \
            cargo test --release --locked -p albumen --features test-hooks --test m7_hide_persist \
            m7_recheck_and_img_diagnostics -- --exact --nocapture 2>&1 | tee m7-recheck.log
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; 41 filtered out' m7-recheck.log \
            || { echo "::error::m7_recheck_and_img_diagnostics did not run exactly 1 test green"; exit 1; }
          n=$(grep -Ec '^M7 RECHECK_DIAG files=' m7-recheck.log || true)
          [ "$n" -ge 3 ] || { echo "::error::expected >= 3 M7 RECHECK_DIAG lines (one per tombstone level), got $n"; exit 1; }
          grep -E '^M7 RECHECK_DIAG' m7-recheck.log
          # Product Lead 0905Z (4): sync2s_max is held to the existing re-check
          # max (100 ms); the first 2 s after a sync are not exempt.
          grep -E '^M7 RECHECK_SYNC_REQ' m7-recheck.log || true
          grep -E '^M7 RECHECK_SPLIT' m7-recheck.log
          awk '/^M7 RECHECK_SPLIT files=/{n++; delete v; for(i=1;i<=NF;i++){split($i,kv,"="); v[kv[1]]=kv[2]} if(v["sync2s_max_ms"]!~/^[0-9.]+$/||v["sync2s_max_ms"]+0>100) bad++} END{exit !(n>=3 && bad==0)}' m7-recheck.log \
            || { echo "::error::sync2s_max over 100 ms (or missing) in m7-recheck.log"; exit 1; }
          # Product Lead 07:03Z (merge-blocking): page-path /api/found at
          # 50k with 10k tombstones, >= 100 samples, p95 <= 20 ms, max <= 100 ms.
          awk '/^M7 POLL files=50000 tombstones=10000 samples=[0-9]+ path=\/api\/found /{n++; for(i=1;i<=NF;i++){split($i,kv,"="); v[kv[1]]=kv[2]} if(v["samples"]<100||v["p95_ms"]>20||v["max_ms"]>100) bad++} END{exit !(n>=1 && bad==0)}' m7-recheck.log \
            || { echo "::error::/api/found bar missed (50k/10k: samples >= 100, p95 <= 20 ms, max <= 100 ms)"; grep -E '^M7 POLL' m7-recheck.log; exit 1; }
          # XO 03:36Z (3): withheld time (server, and as the page sees it
          # through its 200 ms poll) p95 and max <= 1 s, checked by the bar
          # script on every M7 WITHHELD line (no line fails it).
          grep -E '^M7 WITHHELD' m7-recheck.log
          # XO 03:12Z: the same bar on Windows 50k (blocking).
          bash .github/m7-recheck-bar.sh m7-recheck.log
