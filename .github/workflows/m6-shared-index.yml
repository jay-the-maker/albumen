name: m6 shared index

# Manual only. The binding Linux result for the M6 shared-index read bars
# (read p95 <= 20 ms, max <= 100 ms) and the kill test, on a GitHub runner.
# The test library is synthetic and generated in a temp dir; nothing is
# committed and no real photo is read.

on:
  workflow_dispatch:
    inputs:
      files:
        description: "Library size for X2 and X3"
        default: "380000"
      iters:
        description: "X2 writer iterations"
        default: "100"
      kills:
        description: "X3 kills"
        default: "500"

permissions:
  contents: read

jobs:
  m6:
    name: m6 shared index (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FILES: ${{ github.event.inputs.files }}
      ITERS: ${{ github.event.inputs.iters }}
      KILLS: ${{ github.event.inputs.kills }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Build the index tests
        run: cargo test --release --locked -p albumen-ingest --test index_shared --no-run

      - name: X2 at 10,000 files, seeds 1-3 (read bars)
        run: |
          for seed in 1 2 3; do
            ALBUMEN_M6_FILES=10000 ALBUMEN_M6_ITERS=1000 ALBUMEN_M6_SEED=$seed ALBUMEN_M6_READ_BARS=1 \
              cargo test --release --locked -p albumen-ingest --test index_shared -- \
              --exact gui_and_search_tool_share_one_index --nocapture --test-threads=1
          done

      - name: X2 at ${{ github.event.inputs.files }} files, seeds 1-3 (read bars)
        run: |
          for seed in 1 2 3; do
            ALBUMEN_M6_FILES=$FILES ALBUMEN_M6_ITERS=$ITERS \
              ALBUMEN_M6_SEED=$seed ALBUMEN_M6_READ_BARS=1 \
              cargo test --release --locked -p albumen-ingest --test index_shared -- \
              --exact gui_and_search_tool_share_one_index --nocapture --test-threads=1
          done

      - name: X3 kill mid-write at ${{ github.event.inputs.files }} files
        run: |
          ALBUMEN_M6_FILES=$FILES ALBUMEN_M6_KILLS=$KILLS ALBUMEN_M6_SEED=1 \
            cargo test --release --locked -p albumen-ingest --test index_shared -- \
            --exact kill_mid_write_leaves_old_or_new --nocapture --test-threads=1

      - name: The rest of the index tests
        run: cargo test --release --locked -p albumen-ingest --test index_shared
