[package]
name = "albumen-mcp"
version = "0.1.1"
description = "Stdio MCP server for searching, browsing, exporting, and uploading an Albumen library."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "albumen-mcp"
path = "src/main.rs"

[dependencies]
albumen-ingest = { path = "../ingest" }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
sha2 = "0.10"
serde_json = "1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Time"] }

[dev-dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
albumen-ingest = { path = "../ingest" }
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
xattr = "1"
