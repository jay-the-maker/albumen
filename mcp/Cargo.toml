[package]
name = "albumen-mcp"
version = "0.1.1"
description = "Stdio MCP server for searching, browsing, exporting, and uploading an Albumen library."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "albumen-mcp"
path = "src/main.rs"

[dependencies]
albumen-ingest = { path = "../ingest" }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
sha2 = "0.10"
serde_json = "1"

[dev-dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
albumen-ingest = { path = "../ingest" }
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
xattr = "1"
