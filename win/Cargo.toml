[package]
name = "albumen-win"
version = "0.1.0"
description = "Windows alternate-data-stream listing. Ingest stays free of unsafe code."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "time"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "time", "fs"] }
